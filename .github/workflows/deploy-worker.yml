name: Build, test and deploy Worker

# Pull requests: typecheck + tests + build only (no deployment, no secrets used).
# Push to the protected production branch: the same checks, then `wrangler deploy`.
# Manual run: pick staging or production.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/requirements.txt

      - name: Install system OCR dependencies (needed by the PDF/OCR tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - run: npm ci
      - run: pip install -r ingestion/requirements.txt

      - name: JSON schemas are up to date with the Zod definitions
        run: npm run schemas && git diff --exit-code knowledge-schemas

      - run: npm run typecheck
      - run: npm test
      - run: npm run test:py
      - run: npm run build

      - name: Upload build output for the deploy job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: worker-build
          path: apps/web/dist
          retention-days: 3

  deploy:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Environment-scoped secrets + optional required reviewers are configured in GitHub settings.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # Staging needs its own build because the Cloudflare Vite plugin bakes the selected env into the output config.
      - name: Build for the target environment
        env:
          CLOUDFLARE_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' && 'staging' || '' }}
        run: npx vite build

      - name: Deploy with Wrangler
        env:
          # A token scoped to "Workers Scripts: Edit" only. Never reuse the R2 publishing credentials here.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c apps/web/dist/sewasetu_ai/wrangler.json
