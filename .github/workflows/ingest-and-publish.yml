name: Ingest and publish Sewa Setu knowledge

# Daily at 22:00 UTC (~03:30 IST the next day) and on demand (also triggered by the admin panel's "Rebuild").
# Heavy work (crawling, PDF extraction, OCR, indexing) runs here - never inside the Worker.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this run was started (shown in the run log)"
        required: false
        default: manual

permissions:
  contents: read

# Only one publisher at a time so two runs can never race on current.json.
concurrency:
  group: sewasetu-knowledge-publish
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingestion/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install OCR engine (used only for scanned PDF pages)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-asm tesseract-ocr-hin

      - run: pip install -r ingestion/requirements.txt
      - run: npm ci

      - name: Pipeline unit tests (fail fast before touching the network)
        run: python -m pytest -q ingestion/tests

      # Raw source cache enables conditional requests (ETag / Last-Modified) between runs.
      - name: Restore raw source cache
        uses: actions/cache@v4
        with:
          path: ingestion/.cache/raw
          key: raw-sources-${{ github.run_id }}
          restore-keys: raw-sources-

      - name: Crawl, extract, validate and publish
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          # R2 S3-compatible credentials: an R2 API token scoped to this bucket (Object Read & Write) only.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Only needed when embeddings are enabled (repo variable ENABLE_EMBEDDINGS=true).
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          ENABLE_EMBEDDINGS: ${{ vars.ENABLE_EMBEDDINGS }}
        run: |
          EXTRA=""
          if [ "$ENABLE_EMBEDDINGS" = "true" ]; then EXTRA="--embeddings"; fi
          # Upload happens only if validation AND the TypeScript schema check pass; current.json is switched last.
          python ingestion/run_ingestion.py \
            --output build/release --validate --publish --store r2 \
            --pre-publish-check "npx tsx scripts/validate-release.ts build/release" $EXTRA

      - name: Keep the reports for review (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-reports
          path: build/release/reports
          retention-days: 30
          if-no-files-found: ignore
